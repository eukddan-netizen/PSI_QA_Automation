[pytest]
pythonpath = .
testpaths = tests
python_files = test_check_*.py test_*.py
python_functions = test_*
addopts = --import-mode=importlib -v -ra
markers =
    tier_a: 레지스트리/net 명령/Windows 기본 설정만으로 완전 자동화 가능한 점검
    tier_b: 외부 프로그램 설치 또는 복잡한 환경 구성이 필요한 점검
    tier_c: 서버 정책 등록, 폐쇄망, 하드웨어, 대량 데이터 등 별도 환경이 필요한 점검
    excluded: 수동만 가능하거나 테스트할 시나리오가 사실상 없어 자동화에서 제외한 점검
    check01: 1. 바이러스 백신 설치 및 실행 여부 점검
    check02: 2. 바이러스 백신 최신 보안 패치 점검
    check03: 3. OS, MS 최신 보안 패치 점검
    check04: 4. 한글 프로그램 최신 보안 패치 점검
    check05: 5. 로그인 암호 안전성 점검
    check06: 6. 로그인 암호 분기별 변경 여부 점검
    check07: 7. 화면 보호기 설정 여부 점검
    check08: 8. 사용자 공유 폴더 존재 여부 점검
    check09: 9. USB 자동 실행 여부 점검
    check10: 10. 미사용(3개월) ActiveX 프로그램 존재 여부 점검
    check11: 11. PDF 프로그램 최신 보안 패치 점검
    check12: 12. 편집 프로그램 설치 여부 점검
    check13: 13. 무선랜카드 설치 여부 점검
    check14: 14. 보안 USB 설치 여부 점검
    check15: 15. 금지 SW 설치 여부 점검
    check16: 16. 사용자 PC 프로세스 목록 수집 기능
    check17: 17. 메인 계정 외 기타 계정 존재 여부 점검
    check18: 18. 확장 편집 프로그램 설치 여부 점검
    check19: 19. Adobe Flash Player 설치 여부 점검
    check20: 20. JAVA 최신 보안 패치 점검
    check21: 21. 방화벽 실행 여부 점검
    check22: 22. 복구콘솔에서 자동로그온 금지 설정 여부 점검
    check23: 23. 원격 지원 금지 설정 여부 점검
    check24: 24. 파일 시스템 NTFS 사용 여부 점검
    check25: 25. 멀티 윈도우 OS 사용 여부 점검
    check26: 26. Google Chrome 최신 업데이트 점검
    check27: 27. 유해 SW 설치 여부 점검
    check28: 28. 유해 ActiveX 설치 여부 점검
    check29: 29. 유해 프로세스 실행 여부 점검
    check30: 30. 미사용 계정 존재 여부 점검
    check31: 31. Guest 계정 사용 여부 점검
    check32: 32. Administrator 계정 사용 여부 점검
    check33: 33. 암호 사용 기간 제한 설정 여부 점검
    check34: 34. 윈도우 자동 업데이트 설정 여부 점검
    check35: 35. 보안센터 실행 여부 점검
    check36: 36. NTP 시간서버와 자동 동기화 설정 여부 점검
    check37: 37. 최근 암호 기억 기능 사용 여부 점검
    check38: 38. 암호 사용 최대/최소 기간 설정 여부 점검
    check39: 39. 원격 데스크톱 포트 설정 점검
    check40: 40. 비인가된 사용자의 널(Null) 세션 접근 제어 설정 여부 점검
    check41: 41. 신뢰 사이트 등록 여부 점검
    check42: 42. 사용자 계정 컨트롤(UAC) 설정 여부 점검
    check43: 43. Host 파일 사용 여부 점검
    check44: 44. 인가된 DNS 서버 사용 점검
    check45: 45. 절전 모드 정책 설정 여부 점검
    check46: 46. 하드디스크 절전 정책 설정 여부 점검
    check47: 47. 모니터 절전 정책 설정 여부 점검
    check48: 48. 윈도우 자동 로그온 금지 설정 여부 점검
    check49: 49. 윈도우 패치 지원 종료 여부 점검
    check50: 50. 비인가 무선 AP 사용 여부 점검
    check51: 51. 비인가 서비스 사용 여부 점검
    check52: 52. 비인가 메신저 사용 여부 점검
    check53: 53. 방화벽 정책 설정 여부 점검
    app_check: 프로그램 자체 UI 및 기능 점검
    app_tray: 트레이 아이콘 대분류 전체 점검
    tray_01: [트레이 아이콘 > 01. 내PC보안점검] (TC 1_0001~1_0003)
    tray_02: [트레이 아이콘 > 02. 패치 현황] (TC 2_0001)
    tray_03: [트레이 아이콘 > 03. 사용자 정보 입력] (TC 3_0001~3_0004)
    tray_04: [트레이 아이콘 > 04. 프로그램 목록 재확인] (TC 4_0001)
    tray_05: [트레이 아이콘 > 05. 폰트 목록 재확인] (TC 5_0001)
    tray_06: [트레이 아이콘 > 06. 에이전트 업데이트 실행] (TC 6_0001)
    tray_07: [트레이 아이콘 > 07. 정보 확인] (TC 7_0001)
    app_main: 보안점검 메인 탭 대분류 전체 점검
    main_01: [보안점검 메인 탭 > 01. 점검 정보] (Row 20~23)
    main_02: [보안점검 메인 탭 > 02. PC보안지표] (Row 24)
    main_03: [보안점검 메인 탭 > 03. 사용자 정보] (Row 25~26)
    main_04: [보안점검 메인 탭 > 04. 도움말] (Row 27~31)
    main_05: [보안점검 메인 탭 > 05. 암호 안전성 검사] (Row 32)
    main_06: [보안점검 메인 탭 > 06. 지난 검사내역] (Row 33~34)
    app_inspection: 점검 진행 화면 점검
    app_history: 점검이력 탭 및 엑셀 내보내기 점검
    app_clean: PC정리 탭 및 시스템 정보 연동 점검
    app_settings: 설정 탭 점검
    app_result: 점검결과 탭 공통 UI 및 정렬 점검
