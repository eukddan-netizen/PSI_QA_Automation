app_checks:
  - id: app_01
    folder: 01_tray_menu
    title: 트레이 아이콘
    excel_rows: 9~19
    marker: app_tray
    description: 트레이 아이콘 대분류 (내PC보안점검, 사용자 정보 입력, 프로그램/폰트 목록 재확인, 업데이트, 정보 확인)
    subcategories:
      - id: tray_01
        folder: 01_내PC보안점검
        title: 내PC보안점검
        excel_rows: 9~11
        tc_ids: ["1_0001", "1_0002", "1_0003"]
      - id: tray_02
        folder: 02_사용자정보입력
        title: 사용자 정보 입력
        excel_rows: 12~15
        tc_ids: ["2_0001", "2_0002", "2_0003", "2_0004"]
      - id: tray_03
        folder: 03_프로그램목록재확인
        title: 프로그램 목록 재확인
        excel_rows: 16
        tc_ids: ["3_0001"]
      - id: tray_04
        folder: 04_폰트목록재확인
        title: 폰트 목록 재확인
        excel_rows: 17
        tc_ids: ["4_0001"]
      - id: tray_05
        folder: 05_에이전트업데이트실행
        title: 에이전트 업데이트 실행
        excel_rows: 18
        tc_ids: ["5_0001"]
      - id: tray_06
        folder: 06_정보확인
        title: 정보 확인
        excel_rows: 19
        tc_ids: ["6_0001"]

  - id: app_02
    folder: 02_main_dashboard
    title: 메인 대시보드 및 상호작용 UI
    excel_rows: 20~34
    marker: app_main
    description: 좌측 방패/점수 상태, 안전점수 미만 종료 경고, PC보안지표 hover, 도움말/암호안전성 모달

  - id: app_03
    folder: 03_inspection_run
    title: 점검 진행 탭
    excel_rows: 35~37
    marker: app_inspection
    description: 실시간 점검 진행 항목 표시, 진행률(100%), 완료 후 결과 탭 자동 전환

  - id: app_04
    folder: 04_history
    title: 점검이력 탭 및 엑셀 내보내기
    excel_rows: 38~47
    marker: app_history
    description: 점검 이력 리스트, 상세 내역 토글/전체 펼치기, 엑셀 파일 저장 및 데이터 정합성 검증

  - id: app_05
    folder: 05_pc_clean
    title: PC정리 탭 및 시스템 정보 연동
    excel_rows: 48~58
    marker: app_clean
    description: OS버전/백신/방화벽 실시간 연동, 휴지통, %temp%, 브라우저 캐시 정리 및 실제 OS 삭제 검증

  - id: app_06
    folder: 06_settings
    title: 설정 탭 (일반/외형/정보)
    excel_rows: 59~65
    marker: app_settings
    description: 결과 화면 자동 이동 옵션 해제 팝업, 다크/라이트 테마 변경 및 버전 정보 출력

  - id: app_07
    folder: 07_result_common
    title: 점검결과 탭 공통 UI 및 정렬
    excel_rows: 66~71
    marker: app_result
    description: 방패/점수 및 카운트 무결성, 결과 테이블 헤더(번호, 항목명, 결과) 클릭 정렬 검증
